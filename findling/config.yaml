name: "findling"
description: "Dein Zeug. Dein System. Hab ich. Weiß ich. Find ich."
version: "1.1.0"
slug: "findling"
url: "https://jungkonzept.de/"
arch:
  - aarch64
  - amd64
# S6 aus dem Basis-Image muss Prozess 1 sein.
init: false
startup: application
boot: auto
# Zugang über die Anmeldung von Home Assistant. Kein eigenes Passwort und kein offener Port nötig.
ingress: true
ingress_port: 8099
panel_icon: "mdi:archive-search-outline"
panel_title: "findling"
panel_admin: true
# Bewusst keine Rechte auf Home Assistant, das System oder andere Ordner.
hassio_api: false
homeassistant_api: false
auth_api: false
host_network: false
full_access: false
apparmor: true
tmpfs: true
# Netzlaufwerke, die in Home Assistant unter „Speicher“ mit Zweck „Freigabe“ eingebunden sind.
map:
  - type: share
    read_only: false
# Der Direktzugang ist aus. Ohne eingetragenen Port ist von außen nichts erreichbar.
ports:
  8787/tcp: null
  8788/tcp: null
ports_description:
  8787/tcp: "Nur Zertifikat und Weiterleitung auf HTTPS"
  8788/tcp: "Direktzugang per HTTPS mit PIN, für die Kopie auf dem Telefon"
# Die eigenen Sicherungen liegen schon in Home Assistants Sicherung als aktuelle Daten vor.
backup_exclude:
  - "sicherungen/*"
options:
  language: "de"
  anthropic_api_key: ""
  qr_base_url: "http://homeassistant.local:8123"
  direct_access: false
  pin: ""
  hostname: "homeassistant.local"
schema:
  language: list(de|en)
  anthropic_api_key: password?
  qr_base_url: url
  direct_access: bool
  pin: password?
  hostname: str
